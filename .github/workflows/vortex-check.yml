name: Vortex checks

on:
  push:
    branches:
      - feature/vortex-dial-view
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "package.json"
      - ".github/workflows/vortex-check.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
